<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Gracias! | Albaside Studio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="https://res.cloudinary.com/f3h66ynr/image/upload/c_pad,w_96,h_96,b_rgb:F6F2EC,f_png/logo_negro">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F2EC;--ink:#1C1A17;--accent:#5F6B3C;--muted:#6E655D}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100svh;display:grid;place-items:center;text-align:center;
  background-image:radial-gradient(rgba(28,26,23,.07) 1.3px,transparent 1.3px);background-size:26px 26px}
main{max-width:520px;padding:24px}
img{height:38px;width:auto;margin:0 auto 34px;display:block}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(36px,7vw,52px);line-height:1.1}
h1 em{font-style:italic;color:var(--accent)}
p{color:var(--muted);margin-top:16px;font-size:18px}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <img src="https://res.cloudinary.com/f3h66ynr/image/upload/q_auto,f_auto,h_120/logo_negro" alt="Albaside Studio">
  <h1>¡Gracias, <em>de corazón!</em></h1>
  <p>Recibimos sus palabras. Para nosotros significan muchísimo.</p>
  <p><a href="https://www.instagram.com/albaside/">Síguenos en Instagram</a></p>
</main>
</body>
</html>
